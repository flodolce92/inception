services:
  mariadb:
    container_name: mariadb
    image: mariadb:inception
    build: ./requirements/mariadb
    env_file: .env
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      - db-network
    restart: on-failure
    secrets:
      - db_root_password
      - db_password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -u root -p$(cat /run/secrets/db_root_password)',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    container_name: redis
    image: redis:inception
    build: ./requirements/bonus/redis
    networks:
      - db-network
    restart: on-failure

  wordpress:
    container_name: wordpress
    image: wordpress:inception
    build: ./requirements/wordpress
    env_file: .env
    volumes:
      - wp-data:/var/www/html
    networks:
      - db-network
      - proxy-network
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

  adminer:
    container_name: adminer
    image: adminer:inception
    build: ./requirements/bonus/adminer
    networks:
      - db-network
      - proxy-network
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure

  ftp:
    container_name: ftp
    image: ftp:inception
    build: ./requirements/bonus/ftp
    env_file: .env
    ports:
      - '21:21'
      - '21100-21110:21100-21110'
    volumes:
      - wp-data:/var/www/html
    networks:
      - proxy-network
    depends_on:
      - wordpress
    restart: on-failure
    secrets:
      - ftp_password

  website:
    container_name: website
    image: website:inception
    build: ./requirements/bonus/website
    networks:
      - proxy-network
    restart: on-failure

  portainer:
    container_name: portainer
    image: portainer:inception
    build: ./requirements/bonus/portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - proxy-network
    restart: on-failure

  uptime-kuma:
    container_name: uptime-kuma
    image: uptime-kuma:inception
    build: ./requirements/bonus/uptime-kuma
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - proxy-network
      - db-network
    restart: on-failure

  nginx:
    container_name: nginx
    image: nginx:inception
    build: ./requirements/nginx
    env_file: .env
    ports:
      - '443:443'
    volumes:
      - wp-data:/var/www/html
    networks:
      - proxy-network
    depends_on:
      - wordpress
      - adminer
      - website
      - portainer
      - uptime-kuma
    restart: on-failure

networks:
  db-network:
    driver: bridge
  proxy-network:
    driver: bridge

volumes:
  db-volume:
    driver: local
    driver_opts:
      type: none
      device: /home/flo-dolc/data/mariadb
      o: bind
  wp-data:
    driver: local
    driver_opts:
      type: none
      device: /home/flo-dolc/data/wordpress
      o: bind
  portainer-data:
  uptime-kuma-data:

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
