services:
  mariadb:
    container_name: mariadb
    image: mariadb:inception
    build: ./requirements/mariadb
    env_file: .env
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      - db-network
    restart: on-failure

  wordpress:
    container_name: wordpress
    image: wordpress:inception
    build: ./requirements/wordpress
    env_file: .env
    volumes:
      - wp-data:/var/www/html
    networks:
      - db-network
      - proxy-network
    depends_on:
      - mariadb
    restart: on-failure

  nginx:
    container_name: nginx
    image: nginx:inception
    build: ./requirements/nginx
    env_file: .env
    ports:
      - "443:443"
    volumes:
      - wp-data:/var/www/html
    networks:
      - proxy-network
    depends_on:
      - wordpress
    restart: on-failure

networks:
  db-network:
    driver: bridge
  proxy-network:
    driver: bridge

volumes:
  db-volume:
    driver: local
    driver_opts:
      type: none
      device: /home/flo-dolc/data/mariadb
      o: bind
  wp-data:
    driver: local
    driver_opts:
      type: none
      device: /home/flo-dolc/data/wordpress
      o: bind
