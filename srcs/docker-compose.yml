services:
  mariadb:
    container_name: mariadb
    image: mariadb:inception
    build: ./requirements/mariadb
    env_file: .env
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      - db-network
    restart: on-failure
    secrets:
      - db_root_password
      - db_password

  wordpress:
    container_name: wordpress
    image: wordpress:inception
    build: ./requirements/wordpress
    env_file: .env
    volumes:
      - wp-data:/var/www/html
    networks:
      - db-network
      - proxy-network
    depends_on:
      - mariadb
      - redis
    restart: on-failure
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

  redis:
    container_name: redis
    image: redis:inception
    build: ./requirements/bonus/redis
    networks:
      - db-network
    restart: on-failure

  ftp:
    container_name: ftp
    image: ftp:inception
    build: ./requirements/bonus/ftp
    env_file: .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wp-data:/var/www/html
    networks:
      - proxy-network
    depends_on:
      - wordpress
    restart: on-failure
    secrets:
      - ftp_password

  adminer:
    container_name: adminer
    image: adminer:inception
    build: ./requirements/bonus/adminer
    ports:
      - "8080:8080"
    networks:
      - db-network
    depends_on:
      - mariadb
    restart: on-failure

  nginx:
    container_name: nginx
    image: nginx:inception
    build: ./requirements/nginx
    env_file: .env
    ports:
      - "443:443"
    volumes:
      - wp-data:/var/www/html
    networks:
      - proxy-network
    depends_on:
      - wordpress
    restart: on-failure

networks:
  db-network:
    driver: bridge
  proxy-network:
    driver: bridge

volumes:
  db-volume:
    driver: local
    driver_opts:
      type: none
      device: /home/flo-dolc/data/mariadb
      o: bind
  wp-data:
    driver: local
    driver_opts:
      type: none
      device: /home/flo-dolc/data/wordpress
      o: bind

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
